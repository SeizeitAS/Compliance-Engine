# Local Midnight network (ledger 9) for Compliance-Engine CE-29. Derived from the hello-world
# compose.yml in github.com/midnightntwrk/midnight-examples (Apache-2.0), with:
#  - alternative host ports, because 6300, 9944 and 9933 are taken by older containers on this host;
#  - no proof-server service: the ledger 9 proof server `proof-server-l9` (port 6301) is reused.
# The passwords and secret below are the PUBLIC example values of that repository for a throwaway local
# chain; they protect nothing and must never be reused anywhere else.
# Images are the pins in that repository's toolchain.json (node 2.1.101, indexer 4.4.101).
name: ce-local
services:
  indexer:
    image: 'midnightntwrk/indexer-standalone:4.4.101'
    restart: on-failure
    ports:
      - '127.0.0.1:18088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'e2e-test-dummy-id'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: 'midnightntwrk/midnight-node:2.1.101'
    ports:
      - '127.0.0.1:19944:9944'
    # Healthy only once block 1 exists (the indexer exits if it starts at block 0).
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >-
          curl -sf -H 'Content-Type: application/json'
          -d '{"id":1,"jsonrpc":"2.0","method":"chain_getHeader","params":[]}'
          http://localhost:9944 | grep -q '"number":"0x[1-9a-f]'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
